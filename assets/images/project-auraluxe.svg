<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-grad-2" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg-grad-2)" rx="16"/>
  <circle cx="200" cy="100" r="160" fill="#38bdf8" fill-opacity="0.1" filter="blur(60px)"/>
  <circle cx="650" cy="400" r="180" fill="#2563eb" fill-opacity="0.12" filter="blur(70px)"/>

  <!-- Main E-Commerce Window -->
  <g filter="url(#shadow2)">
    <rect x="50" y="40" width="700" height="420" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- Window Header -->
    <rect x="50" y="40" width="700" height="44" rx="12" fill="#1e293b"/>
    <circle cx="76" cy="62" r="5" fill="#ef4444"/>
    <circle cx="94" cy="62" r="5" fill="#f59e0b"/>
    <circle cx="112" cy="62" r="5" fill="#10b981"/>
    <text x="400" y="67" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">auraluxe.store/collections/spring-couture</text>

    <!-- Navigation Header inside App -->
    <rect x="50" y="84" width="700" height="46" fill="#111827" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="80" y="112" fill="#ffffff" font-family="'Cinzel', serif, system-ui" font-size="15" font-weight="700" letter-spacing="3">AURA LUXE</text>
    <text x="240" y="112" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">NEW ARRIVALS</text>
    <text x="360" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">COLLECTIONS</text>
    <text x="470" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">EDITORIAL</text>
    <rect x="630" y="96" width="90" height="26" rx="13" fill="#2563eb"/>
    <text x="675" y="113" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cart (3)</text>

    <!-- Product Hero Left -->
    <g transform="translate(80, 150)">
      <rect width="280" height="280" rx="10" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)"/>
      <!-- Stylized Dress / Coat Silhouette -->
      <path d="M140 40 L165 90 L200 130 L180 230 L100 230 L80 130 L115 90 Z" fill="#2563eb" fill-opacity="0.8"/>
      <path d="M140 40 L155 90 L170 230 L110 230 L125 90 Z" fill="#38bdf8" fill-opacity="0.9"/>
      <rect x="20" y="20" width="60" height="20" rx="4" fill="#d97706"/>
      <text x="50" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">LIMITED</text>
    </g>

    <!-- Product Info Right -->
    <g transform="translate(385, 155)">
      <text x="0" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">SPRING 2026 SIGNATURE</text>
      <text x="0" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Celestial Silk Trench Coat</text>
      <text x="0" y="85" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13">★★★★★ <tspan fill="#94a3b8" font-size="11">(142 verified reviews)</tspan></text>
      <text x="0" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="700">$1,850 <tspan fill="#64748b" font-size="14" text-decoration="line-through">$2,200</tspan></text>
      <text x="0" y="155" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Tailored with Japanese mulberry silk, thermal-regulating</text>
      <text x="0" y="173" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">lining, and titanium-engraved buttons.</text>

      <!-- Color swatches -->
      <circle cx="15" cy="205" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="45" cy="205" r="10" fill="#e2e8f0"/>
      <circle cx="75" cy="205" r="10" fill="#2563eb"/>

      <!-- CTA Button -->
      <rect x="0" y="235" width="180" height="42" rx="8" fill="#2563eb"/>
      <text x="90" y="261" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Add to Bag • $1,850</text>
      <rect x="195" y="235" width="120" height="42" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
      <text x="255" y="261" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">3D Virtual Fit</text>
    </g>
  </g>
</svg>
