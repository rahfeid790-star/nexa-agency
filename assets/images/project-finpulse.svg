<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-grad-1" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="area-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bg-grad-1)" rx="16"/>
  <circle cx="700" cy="80" r="180" fill="#2563eb" fill-opacity="0.15" filter="blur(60px)"/>
  <circle cx="100" cy="400" r="140" fill="#38bdf8" fill-opacity="0.12" filter="blur(50px)"/>

  <!-- Main Dashboard Window Mockup -->
  <g filter="url(#shadow1)">
    <rect x="50" y="40" width="700" height="420" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- Window Bar -->
    <rect x="50" y="40" width="700" height="44" rx="12" fill="#1e293b"/>
    <circle cx="76" cy="62" r="5" fill="#ef4444"/>
    <circle cx="94" cy="62" r="5" fill="#f59e0b"/>
    <circle cx="112" cy="62" r="5" fill="#10b981"/>
    <text x="400" y="67" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="500">finpulse.app/dashboard/analytics</text>

    <!-- Sidebar Mini -->
    <rect x="50" y="84" width="70" height="376" fill="#0b1120"/>
    <rect x="68" y="110" width="34" height="34" rx="8" fill="url(#blue-grad)"/>
    <circle cx="85" cy="180" r="9" fill="#334155"/>
    <circle cx="85" cy="220" r="9" fill="#38bdf8"/>
    <circle cx="85" cy="260" r="9" fill="#334155"/>
    <circle cx="85" cy="300" r="9" fill="#334155"/>

    <!-- Top Stats Cards -->
    <rect x="140" y="104" width="170" height="85" rx="8" fill="#1e293b" stroke="rgba(56,189,248,0.2)"/>
    <text x="156" y="128" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">TOTAL REVENUE</text>
    <text x="156" y="156" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">$2,489,120</text>
    <text x="156" y="176" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">▲ +24.8% vs last mo</text>

    <rect x="325" y="104" width="170" height="85" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
    <text x="341" y="128" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">ACTIVE ACCOUNTS</text>
    <text x="341" y="156" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">142,850</text>
    <text x="341" y="176" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">● 99.98% Healthy</text>

    <rect x="510" y="104" width="220" height="85" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
    <text x="526" y="128" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">AVG TRANSACTIONS</text>
    <text x="526" y="156" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">18,420 / hr</text>
    <text x="526" y="176" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">⚡ Latency: 14ms</text>

    <!-- Chart Panel -->
    <rect x="140" y="205" width="355" height="235" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
    <text x="156" y="230" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Cashflow &amp; Processing Velocity</text>
    <!-- Chart Grid Lines -->
    <line x1="160" y1="260" x2="475" y2="260" stroke="#334155" stroke-dasharray="3,3"/>
    <line x1="160" y1="310" x2="475" y2="310" stroke="#334155" stroke-dasharray="3,3"/>
    <line x1="160" y1="360" x2="475" y2="360" stroke="#334155" stroke-dasharray="3,3"/>
    <line x1="160" y1="410" x2="475" y2="410" stroke="#475569"/>
    <!-- Area & Line Graph -->
    <path d="M 160 380 Q 210 320 260 350 T 360 280 T 470 240 L 470 410 L 160 410 Z" fill="url(#area-grad)"/>
    <path d="M 160 380 Q 210 320 260 350 T 360 280 T 470 240" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
    <circle cx="470" cy="240" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>

    <!-- Right List Panel -->
    <rect x="510" y="205" width="220" height="235" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)"/>
    <text x="526" y="230" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Recent Transactions</text>
    
    <g transform="translate(526, 250)">
      <rect width="188" height="42" rx="6" fill="#0f172a"/>
      <circle cx="20" cy="21" r="10" fill="#2563eb" fill-opacity="0.3"/>
      <text x="36" y="18" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Stripe Global Payout</text>
      <text x="36" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Transfer #84920</text>
      <text x="175" y="25" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">+$12,450</text>
    </g>

    <g transform="translate(526, 302)">
      <rect width="188" height="42" rx="6" fill="#0f172a"/>
      <circle cx="20" cy="21" r="10" fill="#38bdf8" fill-opacity="0.3"/>
      <text x="36" y="18" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">AWS Cloud Svc</text>
      <text x="36" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Billing Recurring</text>
      <text x="175" y="25" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">-$1,840</text>
    </g>

    <g transform="translate(526, 354)">
      <rect width="188" height="42" rx="6" fill="#0f172a"/>
      <circle cx="20" cy="21" r="10" fill="#10b981" fill-opacity="0.3"/>
      <text x="36" y="18" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Sequoia VC Wire</text>
      <text x="36" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Direct Deposit</text>
      <text x="175" y="25" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">+$50,000</text>
    </g>
  </g>
</svg>
