<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-grad-6" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="cyan-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg-grad-6)" rx="16"/>
  <circle cx="680" cy="120" r="160" fill="#00f2fe" fill-opacity="0.1" filter="blur(60px)"/>
  <circle cx="160" cy="380" r="150" fill="#2563eb" fill-opacity="0.15" filter="blur(60px)"/>

  <g filter="url(#shadow6)">
    <rect x="50" y="40" width="700" height="420" rx="12" fill="#09111e" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- Top bar -->
    <rect x="50" y="40" width="700" height="44" rx="12" fill="#152238"/>
    <circle cx="76" cy="62" r="5" fill="#ef4444"/>
    <circle cx="94" cy="62" r="5" fill="#f59e0b"/>
    <circle cx="112" cy="62" r="5" fill="#10b981"/>
    <text x="400" y="67" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">hypercart.logistics/dispatch/live-fleet</text>

    <!-- Top KPI cards -->
    <g transform="translate(80, 100)">
      <rect width="195" height="75" rx="8" fill="#121e33"/>
      <text x="18" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">ACTIVE FLEET SHIPMENTS</text>
      <text x="18" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">18,940</text>
      <text x="110" y="55" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">▲ 99.4% On-Time</text>
    </g>

    <g transform="translate(295, 100)">
      <rect width="195" height="75" rx="8" fill="#121e33"/>
      <text x="18" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">AVG DELIVERY TIME</text>
      <text x="18" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">22.4 min</text>
      <text x="115" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">⚡ -18% vs goal</text>
    </g>

    <g transform="translate(510, 100)">
      <rect width="210" height="75" rx="8" fill="#121e33"/>
      <text x="18" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">AUTONOMOUS DRONES</text>
      <text x="18" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">340 Active</text>
      <text x="125" y="55" fill="#22c55e" font-family="system-ui, sans-serif" font-size="11">● AI Routed</text>
    </g>

    <!-- Map & Fleet Tracking Visual -->
    <g transform="translate(80, 195)">
      <!-- Map Background Panel -->
      <rect width="400" height="245" rx="8" fill="#121e33" stroke="rgba(255,255,255,0.06)"/>
      <!-- Grid Map Lines -->
      <path d="M 20 50 L 380 50 M 20 100 L 380 100 M 20 150 L 380 150 M 20 200 L 380 200" stroke="#1b2a47" stroke-width="1.5"/>
      <path d="M 60 20 L 60 225 M 140 20 L 140 225 M 220 20 L 220 225 M 300 20 L 300 225" stroke="#1b2a47" stroke-width="1.5"/>

      <!-- Glowing Delivery Route Path -->
      <path d="M 70 170 Q 140 90 220 130 T 340 70" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="70" cy="170" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
      <circle cx="220" cy="130" r="5" fill="#00f2fe"/>
      <circle cx="340" cy="70" r="9" fill="#10b981" stroke="#ffffff" stroke-width="2"/>

      <!-- Floating Tooltip on Route -->
      <rect x="235" y="42" width="135" height="32" rx="6" fill="#09111e" stroke="#00f2fe"/>
      <text x="302" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Hub #4 - Arriving in 4m</text>
    </g>

    <!-- Right Live Dispatch Feed -->
    <g transform="translate(500, 195)">
      <rect width="220" height="245" rx="8" fill="#121e33" stroke="rgba(255,255,255,0.06)"/>
      <text x="18" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Real-Time Dispatch</text>

      <g transform="translate(15, 45)">
        <rect width="190" height="50" rx="6" fill="#09111e"/>
        <circle cx="16" cy="25" r="5" fill="#10b981"/>
        <text x="28" y="20" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Parcel #HC-9921</text>
        <text x="28" y="36" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Delivered: Seattle HQ</text>
        <text x="180" y="28" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" text-anchor="end">Just now</text>
      </g>

      <g transform="translate(15, 105)">
        <rect width="190" height="50" rx="6" fill="#09111e"/>
        <circle cx="16" cy="25" r="5" fill="#38bdf8"/>
        <text x="28" y="20" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Drone Flight #D-408</text>
        <text x="28" y="36" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">In Transit • 0.8 miles</text>
        <text x="180" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" text-anchor="end">2m ago</text>
      </g>

      <g transform="translate(15, 165)">
        <rect width="190" height="50" rx="6" fill="#09111e"/>
        <circle cx="16" cy="25" r="5" fill="#f59e0b"/>
        <text x="28" y="20" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Smart Cargo #T-102</text>
        <text x="28" y="36" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Customs Cleared • SFO</text>
        <text x="180" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="end">5m ago</text>
      </g>
    </g>
  </g>
</svg>
