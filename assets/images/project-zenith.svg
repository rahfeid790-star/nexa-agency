<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg-grad-5" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1821"/>
      <stop offset="100%" stop-color="#1e2a38"/>
    </linearGradient>
    <linearGradient id="glass-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg-grad-5)" rx="16"/>
  <circle cx="200" cy="150" r="160" fill="#38bdf8" fill-opacity="0.12" filter="blur(60px)"/>
  <circle cx="650" cy="380" r="180" fill="#2563eb" fill-opacity="0.15" filter="blur(70px)"/>

  <g filter="url(#shadow5)">
    <rect x="50" y="40" width="700" height="420" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- Top bar -->
    <rect x="50" y="40" width="700" height="44" rx="12" fill="#1e293b"/>
    <circle cx="76" cy="62" r="5" fill="#ef4444"/>
    <circle cx="94" cy="62" r="5" fill="#f59e0b"/>
    <circle cx="112" cy="62" r="5" fill="#10b981"/>
    <text x="400" y="67" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">zenithliving.luxury/estates/villa-solaris</text>

    <!-- App Header -->
    <rect x="50" y="84" width="700" height="46" fill="#131e2e"/>
    <text x="80" y="113" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">ZENITH <tspan fill="#38bdf8">LIVING</tspan></text>
    <text x="240" y="113" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PROPERTIES</text>
    <text x="360" y="113" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">ARCHITECTS</text>
    <text x="470" y="113" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">PRIVATE TOURS</text>
    <rect x="625" y="96" width="95" height="26" rx="6" fill="#2563eb"/>
    <text x="672" y="113" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Book Showing</text>

    <!-- Main Architectural Visual -->
    <g transform="translate(80, 150)">
      <rect width="380" height="280" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
      <!-- Modern Architectural Villa Geometry -->
      <polygon points="40,240 180,80 340,80 340,240" fill="#0f172a"/>
      <polygon points="180,80 340,80 300,160 140,160" fill="#2563eb" fill-opacity="0.3"/>
      <!-- Glass facade panels -->
      <rect x="70" y="140" width="70" height="90" rx="4" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="160" y="140" width="100" height="90" rx="4" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="280" y="140" width="40" height="90" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Pool & Reflections -->
      <rect x="50" y="240" width="280" height="25" rx="4" fill="#0284c7" fill-opacity="0.6"/>

      <!-- Floating Price Tag -->
      <rect x="20" y="20" width="130" height="32" rx="6" fill="#0f172a" stroke="rgba(56,189,248,0.5)"/>
      <text x="85" y="41" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">$14,500,000</text>
    </g>

    <!-- Detail Meta Panel -->
    <g transform="translate(480, 155)">
      <text x="0" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">MONTECITO, CALIFORNIA</text>
      <text x="0" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Villa Solaris Sanctuary</text>
      <text x="0" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Ultra-luxury minimalist cliffside estate with</text>
      <text x="0" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">panoramic Pacific views &amp; smart automation.</text>

      <g transform="translate(0, 120)">
        <rect width="68" height="55" rx="6" fill="#1e293b"/>
        <text x="34" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">6</text>
        <text x="34" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Bedrooms</text>

        <rect x="78" y="0" width="68" height="55" rx="6" fill="#1e293b"/>
        <text x="112" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">8.5</text>
        <text x="112" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Baths</text>

        <rect x="156" y="0" width="80" height="55" rx="6" fill="#1e293b"/>
        <text x="196" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">11,200</text>
        <text x="196" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Sq Ft</text>
      </g>

      <rect x="0" y="200" width="235" height="42" rx="8" fill="#2563eb"/>
      <text x="117" y="226" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Take Interactive 3D Tour</text>
      <rect x="0" y="250" width="235" height="34" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.08)"/>
      <text x="117" y="272" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Download Architectural Blueprint</text>
    </g>
  </g>
</svg>
